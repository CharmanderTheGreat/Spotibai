<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpotiBai</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-container {
      background-color: #181818;
      padding: 30px 20px;
      border-radius: 20px;
      width: 100%;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }

    .cards-wrapper {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 10px 10px 20px;
      margin-bottom: 20px;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }

    .cards-wrapper::-webkit-scrollbar {
      height: 6px;
    }

    .cards-wrapper::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 10px;
    }

    .song-tab {
      flex: 0 0 160px;
      background: #222;
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      scroll-snap-align: center;
      border: 2px solid transparent;
      opacity: 0.55;
      transform: scale(0.92);
      transition: all 0.3s ease;
      text-align: left;
    }

    .song-tab:hover {
      opacity: 0.85;
    }

    .song-tab.active {
      opacity: 1;
      transform: scale(1.05);
      background: #262626;
      border-color: #1db954;
      box-shadow: 0 8px 24px rgba(29, 185, 84, 0.25);
    }

    .tab-img {
      width: 100%;
      height: 140px;
      border-radius: 10px;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .tab-title {
      font-size: 0.9rem;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .song-tab.active .tab-title {
      color: #1db954;
    }

    .tab-artist {
      font-size: 0.75rem;
      color: #b3b3b3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-playing {
      margin-bottom: 15px;
    }

    .now-playing h2 {
      font-size: 1.3rem;
      margin-bottom: 4px;
    }

    .now-playing h3 {
      font-size: 0.9rem;
      color: #b3b3b3;
      font-weight: normal;
    }

    .progress-container {
      background: #333;
      border-radius: 6px;
      cursor: pointer;
      margin: 15px 0 25px;
      height: 6px;
      width: 100%;
    }

    .progress {
      background-color: #1db954;
      border-radius: 6px;
      height: 100%;
      width: 0%;
      transition: width 0.1s linear;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .btn {
      background: none;
      border: none;
      color: #b3b3b3;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px;
      transition: all 0.2s;
    }

    .btn svg {
      width: 20px;
      height: 20px;
      fill: #b3b3b3;
      transition: fill 0.2s, filter 0.2s;
    }

    .btn:hover svg {
      fill: #fff;
    }

    /* Green highlight kapag active */
    .btn.active svg {
      fill: #1db954;
      filter: drop-shadow(0 0 6px rgba(29, 185, 84, 0.6));
    }

    .play-btn {
      background-color: #1db954;
      width: 52px;
      height: 52px;
      border-radius: 50%;
    }

    .play-btn svg {
      width: 22px;
      height: 22px;
      fill: #000;
    }

    .play-btn:hover {
      transform: scale(1.08);
    }

    .play-btn:hover svg {
      fill: #000;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="cards-wrapper" id="cardsWrapper"></div>

    <div class="now-playing">
      <h2 id="title">Song Title</h2>
      <h3 id="artist">Artist Name</h3>
    </div>

    <audio id="audio"></audio>

    <div class="progress-container" id="progress-container">
      <div class="progress" id="progress"></div>
    </div>

    <div class="controls">
      <!-- Shuffle Button -->
      <button id="shuffleBtn" class="btn" title="Shuffle">
        <svg viewBox="0 0 24 24">
          <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
        </svg>
      </button>

      <!-- Previous Button -->
      <button id="prev" class="btn" title="Previous">
        <svg viewBox="0 0 24 24">
          <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
        </svg>
      </button>

      <!-- Play/Pause Button -->
      <button id="play" class="btn play-btn" title="Play">
        <svg id="playIcon" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>

      <!-- Next Button -->
      <button id="next" class="btn" title="Next">
        <svg viewBox="0 0 24 24">
          <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
        </svg>
      </button>

      <!-- Loop Button -->
      <button id="loopBtn" class="btn active" title="Repeat List">
        <svg id="loopIcon" viewBox="0 0 24 24">
          <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const songs = [
      { title: 'Wait a Minute', artist: 'Bai', src: 'music/song1.mp3', cover: 'images/cover1.jpg' },
      { title: 'She Got Her Otin', artist: 'Rene Bai', src: 'music/song2.mp3', cover: 'images/cover2.jpg' },
      { title: 'Song 3 Title', artist: 'Artist 3', src: 'music/song3.mp3', cover: 'images/cover3.jpg' },
      { title: 'Song 4 Title', artist: 'Artist 4', src: 'music/song4.mp3', cover: 'images/cover4.jpg' },
      { title: 'Song 5 Title', artist: 'Artist 5', src: 'music/song5.mp3', cover: 'images/cover5.jpg' },
      { title: 'Song 6 Title', artist: 'Artist 6', src: 'music/song6.mp3', cover: 'images/cover6.jpg' },
      { title: 'Song 7 Title', artist: 'Artist 7', src: 'music/song7.mp3', cover: 'images/cover7.jpg' },
      { title: 'Song 8 Title', artist: 'Artist 8', src: 'music/song8.mp3', cover: 'images/cover8.jpg' },
      { title: 'Song 9 Title', artist: 'Artist 9', src: 'music/song9.mp3', cover: 'images/cover9.jpg' },
      { title: 'Song 10 Title', artist: 'Artist 10', src: 'music/song10.mp3', cover: 'images/cover10.jpg' }
    ];

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const loopBtn = document.getElementById('loopBtn');
    const loopIcon = document.getElementById('loopIcon');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');
    const progress = document.getElementById('progress');
    const progressContainer = document.getElementById('progress-container');
    const cardsWrapper = document.getElementById('cardsWrapper');

    let songIndex = 0;
    let isShuffle = false;
    let loopState = 1; // 0 = off, 1 = loop all, 2 = loop one

    const icons = {
      play: '<path d="M8 5v14l11-7z"/>',
      pause: '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>',
      loopAll: '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>',
      loopOne: '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/><path d="M13 15V9h-1l-2 1v1h1.5v4H13z"/>'
    };

    function renderTabs() {
      cardsWrapper.innerHTML = '';
      songs.forEach((song, index) => {
        const card = document.createElement('div');
        card.classList.add('song-tab');
        if (index === songIndex) card.classList.add('active');

        card.innerHTML = `
          <img src="${song.cover}" class="tab-img" alt="Cover" />
          <div class="tab-title">${song.title}</div>
          <div class="tab-artist">${song.artist}</div>
        `;

        card.addEventListener('click', () => {
          songIndex = index;
          loadSong(songs[songIndex]);
          playSong();
        });

        cardsWrapper.appendChild(card);
      });
    }

    function updateActiveTab() {
      const cards = document.querySelectorAll('.song-tab');
      cards.forEach((card, index) => {
        if (index === songIndex) {
          card.classList.add('active');
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
          card.classList.remove('active');
        }
      });
    }

    function loadSong(song) {
      title.innerText = song.title;
      artist.innerText = song.artist;
      audio.src = song.src;
      updateActiveTab();
    }

    function playSong() {
      audio.play();
      playIcon.innerHTML = icons.pause;
    }

    function pauseSong() {
      audio.pause();
      playIcon.innerHTML = icons.play;
    }

    playBtn.addEventListener('click', () => {
      const isPlaying = !audio.paused;
      isPlaying ? pauseSong() : playSong();
    });

    function getRandomIndex() {
      let randomIndex = Math.floor(Math.random() * songs.length);
      if (songs.length > 1) {
        while (randomIndex === songIndex) {
          randomIndex = Math.floor(Math.random() * songs.length);
        }
      }
      return randomIndex;
    }

    function prevSong() {
      if (isShuffle) {
        songIndex = getRandomIndex();
      } else {
        songIndex--;
        if (songIndex < 0) {
          songIndex = songs.length - 1;
        }
      }
      loadSong(songs[songIndex]);
      playSong();
    }

    function nextSong() {
      if (isShuffle) {
        songIndex = getRandomIndex();
      } else {
        songIndex++;
        if (songIndex > songs.length - 1) {
          if (loopState === 0) {
            pauseSong();
            audio.currentTime = 0;
            return;
          }
          songIndex = 0;
        }
      }
      loadSong(songs[songIndex]);
      playSong();
    }

    prevBtn.addEventListener('click', prevSong);
    nextBtn.addEventListener('click', nextSong);

    shuffleBtn.addEventListener('click', () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('active', isShuffle);
    });

    loopBtn.addEventListener('click', () => {
      loopState = (loopState + 1) % 3;

      if (loopState === 0) {
        loopIcon.innerHTML = icons.loopAll;
        loopBtn.classList.remove('active');
        loopBtn.title = 'Repeat Off';
      } else if (loopState === 1) {
        loopIcon.innerHTML = icons.loopAll;
        loopBtn.classList.add('active');
        loopBtn.title = 'Repeat List';
      } else if (loopState === 2) {
        loopIcon.innerHTML = icons.loopOne;
        loopBtn.classList.add('active');
        loopBtn.title = 'Repeat Song';
      }
    });

    audio.addEventListener('timeupdate', (e) => {
      const { duration, currentTime } = e.srcElement;
      if (duration) {
        const progressPercent = (currentTime / duration) * 100;
        progress.style.width = `${progressPercent}%`;
      }
    });

    progressContainer.addEventListener('click', (e) => {
      const width = progressContainer.clientWidth;
      const clickX = e.offsetX;
      const duration = audio.duration;
      audio.currentTime = (clickX / width) * duration;
    });

    audio.addEventListener('ended', () => {
      if (loopState === 2) {
        audio.currentTime = 0;
        playSong();
      } else {
        nextSong();
      }
    });

    renderTabs();
    loadSong(songs[songIndex]);
  </script>

</body>
</html>
